
services:
  postgres:
    image: postgres:16
    container_name: shopsphere-product-db
    environment:
      POSTGRES_DB: shopsphere_product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopsphere_product"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: .
    container_name: shopsphere-product-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopsphere_product
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  product_db_data:
